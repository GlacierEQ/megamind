[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "megamind"
version = "1.0.0"
description = "Sovereign Agent Registry & Piston Capability Integration Core for GlacierEQ APEX"
readme = "README.md"
authors = [{ name = "GlacierEQ", email = "apex@glaciereq.io" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]
